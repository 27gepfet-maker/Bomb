<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
    <a-assets>
        <audio id="wind" src="sound1.mp3" preload="auto"></audio>
        <!-- FIX: Removed space from asset ID to keep selectors clean -->
        <audio id="bgm-asset" src="the_mountain-retro-game-593063.mp3" preload="auto"></audio>
    </a-assets>

    <a-scene>
        <a-camera>
            <a-cursor color="black"></a-cursor>
        </a-camera>

        <a-sky color="#ECECEC"></a-sky>
        
        <!-- FIX: Added the 'music' ID here so the bypass script below can find it and start it automatically -->
        

        <a-plane rotation="-90 0 0" width="20" height="20" color="#7BC8A4"></a-plane>

        <!-- FIX: Changed 'on: ;' to 'on: click;' so the sound plays when you click it -->
        <a-box id="box" position="-2 1.5 -5" color="#00FF55" sound="src: #wind; on: click; volume: 1;"></a-box>
        
        <a-sphere id="sphere" position="0 1.5 -5" color="#FF5733"></a-sphere>
        <a-cone id="cone" color="blue" radius-bottom="0.7" radius-top="0.1" height="1.5" position="2 1.5 -5"></a-cone>
    </a-scene>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const scene = document.querySelector('a-scene');
        const music = document.querySelector('#music');

        const startMusic = () => {
          if (music && music.components && music.components.sound) {
            music.components.sound.playSound();
          }
        };

        // Fires automatically on your first movement over the screen
        scene.addEventListener('mousemove', startMusic, { once: true });
        window.addEventListener('touchstart', startMusic, { once: true });
      });
    </script>





</body>
</html>
